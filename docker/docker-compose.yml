services:
  postgres:
    image: postgres:17
    container_name: icebot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: IceBotDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p@ssw0rd12345
    volumes:
      - icebot_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d IceBotDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: icebot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - icebot_minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  icebot-backend-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: icebot-backend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - default # Giữ lại mạng mặc định để API kết nối được với postgres và minio
      - icebot_network # Nối thêm vào mạng chung để API nhìn thấy Aspire Dashboard
    volumes:
      - icebot_keyring:/app/keys
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IceBot_DB: "Host=postgres;Port=5432;Database=IceBotDB;Username=postgres;Password=p@ssw0rd12345"
      RobotArtifacts__ObjectStorage__Endpoint: "minio:9000"
      RobotArtifacts__ObjectStorage__DownloadEndpoint: "${MINIO_DOWNLOAD_ENDPOINT:-localhost:9000}"
      RobotArtifacts__ObjectStorage__AccessKey: "${MINIO_ROOT_USER:-minioadmin}"
      RobotArtifacts__ObjectStorage__SecretKey: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      RobotArtifacts__ObjectStorage__BucketName: "${MINIO_BUCKET_NAME:-icebot-robot-artifacts}"
      RobotArtifacts__ObjectStorage__UseSsl: "false"
      RobotArtifacts__ObjectStorage__DownloadUseSsl: "false"
      RobotArtifacts__ObjectStorage__AutoCreateBucket: "true"

      # --- CẤU HÌNH OBSERVABILITY ĐỂ GỬI LOG VỀ ASPIRE DASHBOARD ---
      Observability__OpenTelemetry__OtlpExporterEnabled: "true"
      Observability__Serilog__OtlpSinkEnabled: "true"
      Observability__OpenTelemetry__OtlpEndpoint: "http://IceBot-tools-aspire-dashboard:18889"

      PublicOrderAccess__KeyRingDirectory: ${PUBLIC_ORDER_ACCESS_KEY_RING_DIR}

      # CẤU HÌNH EMAIL INVITATION URL (Tùy theo cấu trúc section trong appsettings, thường là dạng này)
      Email__InvitationBaseUrl: ${EMAIL_INVITATION_BASE_URL}

volumes:
  icebot_postgres_data:
  icebot_minio_data:
  icebot_keyring:

# --- KHAI BÁO MẠNG DÙNG CHUNG ---
networks:
  icebot_network:
    external: true
