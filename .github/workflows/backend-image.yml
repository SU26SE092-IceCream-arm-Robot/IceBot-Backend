name: Build and Deploy Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: su26se092-icecream-arm-robot/icebot-backend

jobs:
  build:
    name: Build Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ env.IMAGE_NAME }}:main

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: production

    concurrency:
      group: icebot-production
      cancel-in-progress: false

    steps:
      - name: Install NetBird
        shell: bash
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sh

      - name: Connect to IceBot network
        shell: bash
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          sudo netbird up --setup-key "$NETBIRD_SETUP_KEY"
          sudo netbird status

      - name: Wait for deployment server
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          for attempt in {1..30}; do
            if nc -z -w 2 "$DEPLOY_HOST" 22; then
              echo "Deployment server is reachable."
              exit 0
            fi

            echo "Waiting for deployment server... ($attempt/30)"
            sleep 2
          done

          echo "Deployment server did not become reachable."
          exit 1

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/icebot_deploy"
          chmod 600 "$HOME/.ssh/icebot_deploy"

          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy backend
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/icebot_deploy" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /opt/icebot/deploy/deploy-backend.sh '${GITHUB_SHA}'"

      - name: Verify public API
        shell: bash
        run: |
          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --retry 10 \
              --retry-connrefused \
              --retry-delay 3 \
              --max-time 15 \
              https://api.icebot.io.vn/api/v1/me/access
          )"

          echo "api.icebot.io.vn/api/v1/me/access returned HTTP ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "401" ]; then
            echo "ERROR: expected HTTP 401 from unauthenticated access check, got ${HTTP_STATUS}."
            exit 1
          fi
