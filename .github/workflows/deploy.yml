name: CI/CD Pipeline - Backend

on:
  # 1. Chạy CI khi có PR mở ra hoặc cập nhật hướng vào nhánh main
  pull_request:
    branches:
      - main
  # 2. Chạy CD khi code chính thức được merge vào nhánh main
  push:
    branches:
      - main

jobs:
  # ==========================================
  # JOB 1: CHECK & BUILD (CI - Chạy cho cả PR và Push)
  # ==========================================
  build-and-test:
    name: Build & Verify Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' # Nhớ đổi đúng phiên bản .NET dự án bạn đang dùng (8.0 hay 9.0)

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

  # ==========================================
  # JOB 2: DEPLOY TO VPS (CD - CHỈ CHẠY KHI MERGE VÀO MAIN)
  # ==========================================
  deploy:
    name: SSH to VPS and Deploy
    runs-on: ubuntu-latest
    # BẮT BUỘC: Job build ở trên phải thành công VÀ phải là sự kiện Push vào main thì mới Deploy
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Execute Deploy Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/apps/IceBot-Backend
            chmod +x ./docker/deploy.sh
            ./docker/deploy.sh
